[project]
name = "jys-crm"
version = "0.1.0"
description = "CRM de JS CONSULTORES Y ABOGADOS: API interna, base de datos y panel (por fases)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "cryptography>=50,<51",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
