; Migraciones del CRM. La URL NO va aquí: migrations/env.py la toma de MIGRATIONS_DATABASE_URL o de
; CRM_DB_ADMIN_USER / CRM_DB_ADMIN_PASSWORD (dueño de las tablas; en Docker, servicio crm-tools).
;   docker compose run --rm crm-tools alembic upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
